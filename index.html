<head>

<title>NORMAL FF X DALAL Emote Bot</title>
<style>
:root{--bg:#07070b;--surface:#101017;--card:#16161f;--input:#1c1c27;--ink:#f4f1ea;--ink2:#c9c6bf;--muted:#8a8895;--line:#262633;--gold:#f5b942;--gold2:#ff8a3d;--onGold:#1a1206;--glow:rgba(245,185,66,.18);--info:#6674e8;--ok:#10b981;--err:#ef4444}
[data-theme="light"]{--bg:#f3f1ec;--surface:#fff;--card:#faf8f4;--input:#f0ede7;--ink:#17161c;--ink2:#3b3a45;--muted:#77757f;--line:#e2ded5;--gold:#d98a0b;--gold2:#e8590c;--onGold:#fff;--glow:rgba(217,138,11,.16);--ok:#059669;--err:#dc2626}
*{margin:0;padding:0;box-sizing:border-box}
*{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,select{user-select:text;-webkit-user-select:text}
html{background:var(--bg)}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent),var(--bg);color:var(--ink);min-height:100vh;padding:18px 14px 48px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.wrap{max-width:860px;margin:0 auto}
[hidden]{display:none!important}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--onGold);background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 8px 24px var(--glow);font-size:22px}
.brand h1{font-size:20px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.brand span{font-size:12.5px;color:var(--muted)}
.tools{display:flex;align-items:center;gap:10px}
.theme{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:16px}
.switch{position:relative;width:48px;height:26px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--input);border:1px solid var(--line);border-radius:26px;cursor:pointer}
.slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));transition:transform .25s}
.switch input:checked+.slider::before{transform:translateX(22px)}
.switch input:focus-visible+.slider{outline:2px solid var(--gold);outline-offset:2px}

/* instagram logo tile */
.ig{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:18px;flex-shrink:0;background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.ig .i{stroke-width:2}
.ig-pill{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:40px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:13.5px;text-decoration:none;transition:transform .2s,border-color .2s}
.ig-pill:hover{transform:translateY(-2px);border-color:var(--gold)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.panel-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;margin-bottom:16px}
.panel-title .badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--gold);background:var(--glow);font-size:16px}
.panel-title small{margin-left:auto;font-weight:600;color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.uids{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.field label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field label .i{color:var(--muted)}
.field input,.field select{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--input);color:var(--ink);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--glow)}
.field select option{background:var(--surface);color:var(--ink)}

/* emotes */
.emote-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.emote-item{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;transition:transform .2s,border-color .2s,box-shadow .2s}
.emote-item:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 30px var(--glow)}
.emote-item img,.emote-ph{width:88px;height:88px;border-radius:14px;object-fit:contain;background:var(--input);border:1px solid var(--line)}
.emote-ph{display:grid;place-items:center;color:var(--gold);font-size:28px}
.emote-name{font-size:14px;font-weight:700;text-align:center}
.send{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border:0;border-radius:30px;font-weight:800;font-size:14px;cursor:pointer;color:var(--onGold);background:linear-gradient(135deg,var(--gold),var(--gold2));transition:transform .15s,filter .15s}
.send:hover{filter:brightness(1.08)}
.send:active{transform:scale(.96)}
.send:disabled{opacity:.55;cursor:wait}
.send:focus-visible,.btn:focus-visible,.ig-pill:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);padding:13px 24px;border-radius:14px;font-size:14px;font-weight:600;z-index:99999;max-width:90%;text-align:center;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.4);animation:up .35s ease}
.toast-info{background:var(--info)}.toast-success{background:var(--ok)}.toast-error{background:var(--err)}
@keyframes up{from{opacity:0;transform:translateX(-50%) translateY(24px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* lock dialog */
.lock{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(700px 380px at 50% 25%,var(--glow),transparent),var(--bg)}
.lock-box{width:100%;max-width:390px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:32px 24px 24px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lock-ico{width:68px;height:68px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--gold);background:var(--glow);border:1px solid var(--gold);box-shadow:0 0 0 8px var(--glow)}
.lock-box h2{font-size:22px;font-weight:800;margin-bottom:6px}
.lock-box p.sub{font-size:14px;color:var(--muted);margin-bottom:20px}
.pw{position:relative;margin-bottom:6px}
.pw .i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.pw input{width:100%;padding:14px 14px 14px 44px;border-radius:14px;border:1px solid var(--line);background:var(--input);color:var(--ink);font-size:16px;outline:none}
.pw input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--glow)}
.pw input.bad{border-color:var(--err)}
.lock-err{min-height:22px;font-size:13px;color:var(--err);text-align:left;padding:4px 4px 8px}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:30px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;border:0}
.btn.gold{color:var(--onGold);background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 10px 26px var(--glow)}
.btn.gold:hover{filter:brightness(1.08)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.insta{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:9px 16px 9px 9px;justify-content:flex-start}
.btn.insta:hover{border-color:var(--gold)}
.btn.insta .t{flex:1;text-align:center;font-size:14px}
.btn.insta .ig{width:34px;height:34px;font-size:20px}

@media(max-width:640px){.grid2{grid-template-columns:1fr}.uids{grid-template-columns:1fr 1fr}.panel{padding:16px}header{justify-content:center}.brand{width:100%;justify-content:center}.tools{width:100%;justify-content:center}}
@media(max-width:380px){.uids{grid-template-columns:1fr}.emote-list{grid-template-columns:1fr 1fr;gap:10px}.emote-item img,.emote-ph{width:72px;height:72px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.search-wrap{position:relative;margin-bottom:16px}
.search-wrap .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-wrap input{width:100%;padding:12px 14px 12px 42px;border-radius:13px;border:1px solid var(--line);background:var(--input);color:var(--ink);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;user-select:text;-webkit-user-select:text}
.search-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--glow)}
.load-more{width:100%;margin-top:16px;padding:14px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer;transition:.2s}
.load-more:hover{border-color:var(--gold);background:var(--input)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:20px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:640px){.grid3{grid-template-columns:1fr}}
</style>

  var teamCode = document.getElementById('team-code');
  var serverSel = document.getElementById('server');
  var uids = [1, 2, 3, 4, 5, 6].map(function (n) { return document.getElementById('uid' + n); });
  var listOb55 = document.getElementById('emote-list-ob55');
  var listAll = document.getElementById('emote-list-all');
  var searchInput = document.getElementById('emote-search');
  var loadMoreBtn = document.getElementById('load-more');
  var allCount = document.getElementById('all-count');
  var SEND_ICON = '<svg class="i"><use href="#i-send"/></svg> Send';

  // ===== Two APIs =====
  var API2_BASE = 'https://ffemote.pro/api/join';
  var REGION1 = { india: 'ind', pakistan: 'pk', bangladesh: 'bd', indonesia: 'id' };
  var apiSel = document.getElementById('api');

  try { apiSel.value = localStorage.getItem('normalpapa_api') || '1'; } catch (e) {}
  function syncServers() {
    var is1 = apiSel.value === '1';
    Array.prototype.forEach.call(serverSel.options, function (o) {
      if (o.getAttribute('data-api2')) o.disabled = is1;
    });
    if (serverSel.options[serverSel.selectedIndex].disabled) serverSel.value = 'india';
  }
  apiSel.addEventListener('change', function () {
    try { localStorage.setItem('normalpapa_api', apiSel.value); } catch (e) {}
    syncServers();
  });
  syncServers();

  function buildUrl(emoteId) {
    var extra = '';
    for (var i = 2; i <= 6; i++) {
      var v = uids[i - 1].value.trim();
      if (v) extra += '&uid' + i + '=' + encodeURIComponent(v);
    }
    var tc = encodeURIComponent(teamCode.value.trim());
    var u1 = encodeURIComponent(uids[0].value.trim());
    var em = encodeURIComponent(emoteId);

    if (apiSel.value === '2') {
      // API 2: ffemote.pro (long server names)
      return API2_BASE + '?tc=' + tc + '&emote_id=' + em +
        '&server=' + encodeURIComponent(serverSel.value) + '&uid1=' + u1 + extra;
    }
    // API 1: proapi.ffglory.site (short region codes)
    return API_BASE + '?key=' + encodeURIComponent(API_KEY) +
      '&region=' + encodeURIComponent(REGION1[serverSel.value] || 'ind') +
      '&tc=' + tc + '&uid1=' + u1 + extra + '&emote_id=' + em;
  }

  function send(btn, emoteId) {
    if (!teamCode.value.trim() || !uids[0].value.trim()) {
      showToast('Please fill in Team Code and UID 1', 'error');
      return;
    }
    var url = buildUrl(emoteId);
    var apiName = 'API ' + apiSel.value;
    btn.disabled = true;
    showToast('Sending emote...', 'info');

    // Step 1: normal request that does not need to read the reply (works even when CORS blocks reading).
    // Step 2: if the browser refuses that request outright (some in-app viewers only allow images),
    // send the same link as an image request instead. Only one of the two ever reaches the server.
    function viaImage() {
      return new Promise(function (resolve) {
        var beacon = new Image();
        beacon.referrerPolicy = 'no-referrer';
        beacon.onload = beacon.onerror = function () { resolve(); };
        beacon.src = url + '&_=' + Date.now();
        setTimeout(resolve, 6000);
      });
    }

    fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' })
      .then(function () {
        showToast('Emote sent via ' + apiName + '! Check in game.', 'success');
      })
      .catch(function () {
        return viaImage().then(function () {
          showToast('Emote request sent via ' + apiName + ' (backup route). Check in game.', 'success');
        });
      })
      .then(function () { setTimeout(function () { btn.disabled = false; }, 800); });
  }

  function makeCard(em) {
    var item = document.createElement('div');
    item.className = 'emote-item';

    var img = document.createElement('img');
    var sources = [
      IMG + em.id + '.png',
      'https://fastly.jsdelivr.net/gh/ShahGCreator/icon@main/PNG/' + em.id + '.png',
      'https://gcore.jsdelivr.net/gh/ShahGCreator/icon@main/PNG/' + em.id + '.png',
      'https://raw.githubusercontent.com/ShahGCreator/icon/main/PNG/' + em.id + '.png'
    ];
    var tries = 0;
    img.referrerPolicy = 'no-referrer';
    img.alt = em.name;
    img.onerror = function () {
      tries++;
      if (tries < sources.length) { this.src = sources[tries]; return; }
      var ph = document.createElement('div');
      ph.className = 'emote-ph';
      ph.innerHTML = '<svg class="i"><use href="#i-spark"/></svg>';
      if (this.parentNode) this.parentNode.replaceChild(ph, this);
    };
    img.src = sources[0];

    var name = document.createElement('p');
    name.className = 'emote-name';
    name.textContent = em.name;

    var btn = document.createElement('button');
    btn.className = 'send';
    btn.innerHTML = SEND_ICON;
    btn.addEventListener('click', function () { send(btn, em.id); });

    item.appendChild(img);
    item.appendChild(name);
    item.appendChild(btn);
    return item;
  }

  ob55.forEach(function (em) { listOb55.appendChild(makeCard(em)); });

  var PAGE = 30, shown = 0, filtered = allEmotes.slice();
  function renderAll(reset) {
    if (reset) { listAll.innerHTML = ''; shown = 0; }
    filtered.slice(shown, shown + PAGE).forEach(function (em) { listAll.appendChild(makeCard(em)); });
    shown = Math.min(shown + PAGE, filtered.length);
    loadMoreBtn.hidden = shown >= filtered.length;
    allCount.textContent = filtered.length + ' emotes';
    if (!filtered.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No emotes found';
      listAll.appendChild(e);
    }
  }
  searchInput.addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    filtered = !q ? allEmotes.slice() : allEmotes.filter(function (em) {
      return em.name.toLowerCase().indexOf(q) !== -1 || em.id.indexOf(q) !== -1;
    });
    renderAll(true);
  });
  loadMoreBtn.addEventListener('click', function () { renderAll(false); });
  renderAll(true);
})();
